<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Healing Social</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --hr-green: #2e7d32;
            --hr-bg: #000000;
            --hr-card: #18191a;
            --hr-hover: #3a3b3c;
            --hr-text: #e4e6eb;
            --hr-secondary: #b0b3b8;
            --hr-divider: #3e4042;
            --fb-blue: #0866ff;
        }
        body { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; margin: 0; background: var(--hr-bg); color: var(--hr-text); padding-bottom: 70px; overflow-x: hidden; }
        
        .view { display: none; min-height: 100vh; }
        .view.active { display: block; }

        /* Header & Nav */
        .header { background: var(--hr-card); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--hr-divider); }
        .header h1 { color: white; font-size: 24px; margin: 0; font-weight: 800; letter-spacing: -1px; }
        .header-icons { display: flex; gap: 10px; }
        .circle-icon { background: var(--hr-hover); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; font-size: 18px; position: relative; }

        /* Grid for Menu */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .menu-card { background: var(--hr-card); padding: 20px; border-radius: 12px; text-align: center; cursor: pointer; transition: 0.2s; }
        .menu-card:active { transform: scale(0.95); background: var(--hr-hover); }
        .menu-card i { font-size: 24px; margin-bottom: 8px; }

        /* Post & Media */
        .post-card { background: var(--hr-card); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
        .post-media { width: 100%; max-height: 500px; object-fit: cover; }
        .avatar-small { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }

        /* Profile Info */
        .profile-info-grid { padding: 15px 20px; display: flex; flex-direction: column; gap: 10px; }
        .info-item { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--hr-text); }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--hr-card); display: flex; border-top: 1px solid var(--hr-divider); z-index: 1001; height: 65px; }
        .nav-item { flex: 1; text-align: center; display: flex; align-items: center; justify-content: center; color: var(--hr-secondary); font-size: 22px; cursor: pointer; }
        .nav-item.active { color: var(--fb-blue); }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--hr-bg); z-index: 2000; display: none; flex-direction: column; overflow-y: auto; }
        
        .btn-full { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; }
        .bg-blue { background: var(--fb-blue); color: white; }
        .bg-gray { background: var(--hr-hover); color: white; }
        .edit-input { width: 100%; padding: 12px; margin-bottom: 12px; background: var(--hr-hover); border: 1px solid var(--hr-divider); border-radius: 8px; color: white; box-sizing: border-box; }
    </style>
</head>
<body>

    <div id="auth-modal" style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; background:#000; padding:20px;">
        <h1 style="color:white; font-size:42px; margin-bottom:10px; font-weight:800; letter-spacing: -2px;">HEALING</h1>
        
        <div style="width:100%; max-width:350px; background:var(--hr-card); padding:25px; border-radius:15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
            <form onsubmit="handleEmailAuth(event)">
                <input type="text" id="auth-name" class="edit-input" placeholder="Full Name" style="display:none;">
                <input type="email" id="auth-email" class="edit-input" placeholder="Email Address" required>
                <input type="password" id="auth-password" class="edit-input" placeholder="Password" required>
                <button type="submit" id="auth-submit-btn" class="btn-full bg-blue" style="margin-top: 5px;">Log In</button>
            </form>

            <div style="margin: 20px 0; display: flex; align-items: center; color: var(--hr-divider);">
                <div style="flex:1; height:1px; background:var(--hr-divider);"></div>
                <span style="padding:0 10px; font-size:12px; color:var(--hr-secondary); font-weight: bold;">OR</span>
                <div style="flex:1; height:1px; background:var(--hr-divider);"></div>
            </div>

            <button onclick="loginWithGoogle()" class="btn-full bg-gray" style="display:flex; align-items:center; justify-content:center; gap:10px; border: 1px solid var(--hr-divider);">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="18"> Continue with Google
            </button>

            <p id="auth-toggle" onclick="toggleAuthMode()" style="color:var(--fb-blue); text-align:center; cursor:pointer; margin-top:25px; font-weight:600; font-size:14px;">
                Create New Account
            </p>
        </div>
    </div>

    <div id="main-app" style="display:none;">
        <div class="header">
            <h1 style="font-weight: 900;">HEALING</h1>
            <div class="header-icons">
                <div class="circle-icon" onclick="openPostModal()"><i class="fa-solid fa-plus"></i></div>
                <div class="circle-icon" id="site-refresh-btn"><i class="fa-solid fa-rotate-right"></i></div>
            </div>
        </div>

        <div id="home-view" class="view active">
            <div id="discovery-section" style="padding:15px; background:var(--hr-card); border-bottom:1px solid var(--hr-divider);">
                <div id="discovery-users" style="display:flex; overflow-x:auto; gap:15px;"></div>
            </div>
            <div id="feed-items" style="padding:10px;"></div>
        </div>

        <div id="reels-view" class="view">
            <div id="reels-container" style="height: calc(100vh - 65px); overflow-y: scroll; scroll-snap-type: y mandatory;"></div>
        </div>

        <div id="notifications-view" class="view">
            <div style="padding:15px;"><h2 style="margin:0;">Notifications</h2></div>
            <div id="notifications-list" style="padding: 10px;"></div>
        </div>

        <div id="profile-view" class="view">
            <div style="background:var(--hr-card);">
                <div style="height:180px; background:#222; position:relative;">
                    <img id="cover-pic-preview" style="width:100%; height:100%; object-fit:cover;">
                    <button class="circle-icon" style="position:absolute; bottom:10px; right:10px;" onclick="$('#cover-upload').click()"><i class="fa-solid fa-camera"></i></button>
                </div>
                <div style="margin-top:-50px; padding:0 20px;">
                    <div style="position:relative; width:110px;">
                        <img id="profile-pic-preview" style="width:110px; height:110px; border-radius:50%; border:4px solid black; object-fit: cover;">
                        <button class="circle-icon" style="position:absolute; bottom:0; right:0;" onclick="$('#pic-upload').click()"><i class="fa-solid fa-camera"></i></button>
                    </div>
                    <h2 id="profile-name" style="margin:10px 0 5px 0;">Loading...</h2>
                    <p id="profile-bio" style="color:var(--hr-secondary); margin:0;"></p>
                </div>
                
                <div class="profile-info-grid">
                    <div class="info-item"><i class="fa-solid fa-location-dot" style="color:var(--hr-secondary);"></i> <span id="p-location">Earth</span></div>
                    <div class="info-item"><i class="fa-solid fa-phone" style="color:var(--hr-secondary);"></i> <span id="p-phone">Add Phone</span></div>
                </div>

                <div style="padding: 15px 20px; display:flex; gap:10px;">
                    <button class="btn-full bg-blue" onclick="openPostModal()">Add Story</button>
                    <button class="btn-full bg-gray" onclick="openEditModal()">Edit Profile</button>
                </div>
            </div>
        </div>

        <div id="user-profile-view" class="view">
            <div style="padding:15px;"><i class="fa-solid fa-arrow-left" onclick="showView('home')"></i></div>
            <div id="external-profile-content"></div>
        </div>

        <div id="menu-view" class="view">
            <div style="padding:15px; display:flex; align-items:center; gap:15px;" onclick="showView('profile')">
                <img class="user-avatar-sync" style="width:50px; height:50px; border-radius:50%;">
                <div><b id="menu-user-name">User Name</b><br><small>View Profile</small></div>
            </div>
            
            <div class="menu-grid">
                <div class="menu-card" onclick="showView('profile')"><i class="fa-solid fa-user" style="color:#1877f2;"></i><br><b>Profile</b></div>
                <div class="menu-card" onclick="contactAdmin()"><i class="fa-solid fa-user-shield" style="color:#2d6a4f;"></i><br><b>ADMIN DM</b></div>
                <div class="menu-card" onclick="showView('reels')"><i class="fa-solid fa-clapperboard" style="color:#f3425f;"></i><br><b>Reels</b></div>
                <div class="menu-card" onclick="logout()"><i class="fa-solid fa-right-from-bracket" style="color:var(--hr-secondary);"></i><br><b>Log Out</b></div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="showView('home')"><i class="fa-solid fa-house"></i></div>
            <div class="nav-item" onclick="showView('reels')"><i class="fa-solid fa-clapperboard"></i></div>
            <div class="nav-item" onclick="showView('notifications')"><i class="fa-solid fa-bell"></i></div>
            <div class="nav-item" onclick="showView('menu')"><i class="fa-solid fa-bars"></i></div>
        </div>
    </div>

    <div id="edit-modal" class="modal">
        <div style="padding:15px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--hr-divider);">
            <b>Edit Profile</b>
            <span onclick="closeEditModal()" style="font-size:24px;">✕</span>
        </div>
        <div style="padding:20px;">
            <label>Name</label><input id="edit-name" class="edit-input">
            <label>Bio</label><input id="edit-bio" class="edit-input">
            <label>Phone Number</label><input id="edit-phone" class="edit-input" placeholder="+234...">
            <label>WhatsApp Link</label><input id="edit-wa" class="edit-input" placeholder="https://wa.me/...">
            <label>State</label><input id="edit-state" class="edit-input">
            <label>Country</label><input id="edit-country" class="edit-input">
            <button class="btn-full bg-blue" onclick="saveProfileEdits()">Save</button>
        </div>
    </div>

    <div id="post-modal" class="modal">
        <div style="padding: 15px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--hr-divider);">
            <span onclick="closePostModal()">✕</span>
            <b>Create Post</b>
            <button class="bg-blue" onclick="submitPost()" style="border:none; padding:5px 15px; border-radius:5px; color:white;">POST</button>
        </div>
        <textarea id="post-text" placeholder="What's on your mind?" style="width:100%; height:200px; background:transparent; color:white; border:none; padding:20px; font-size:18px; outline:none;"></textarea>
        <div style="padding:20px; border-top:1px solid var(--hr-divider);">
            <label>Photo or Video:</label>
            <input type="file" id="post-file-input" accept="image/*,video/*">
        </div>
    </div>

    <input type="file" id="pic-upload" style="display:none;" onchange="uploadNewProfilePic(this)">
    <input type="file" id="cover-upload" style="display:none;" onchange="uploadCoverPic(this)">

    <script type="module" src="app.js"></script>
    <script>
        const $ = s => document.querySelector(s);
        window.showView = (v) => {
            document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            const view = $(`#${v}-view`);
            if(view) view.classList.add('active');
            
            const navItems = document.querySelectorAll('.nav-item');
            if(v==='home') navItems[0].classList.add('active');
            if(v==='reels') navItems[1].classList.add('active');
            if(v==='notifications') navItems[2].classList.add('active');
            if(v==='menu') navItems[3].classList.add('active');
        };
        window.openPostModal = () => $('#post-modal').style.display = 'flex';
        window.closePostModal = () => $('#post-modal').style.display = 'none';
        window.openEditModal = () => $('#edit-modal').style.display = 'flex';
        window.closeEditModal = () => $('#edit-modal').style.display = 'none';
    </script>
</body>
</html>
