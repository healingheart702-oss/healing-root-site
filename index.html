<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healing Root Agro Ventures</title>
    <style>
        :root {
            --fb-bg: #18191a;
            --fb-card: #242526;
            --fb-text: #e4e6eb;
            --fb-secondary: #b0b3b8;
            --fb-blue: #2374e1;
            --fb-divider: #3e4042;
        }
        body { font-family: Segoe UI, Helvetica, Arial, sans-serif; margin: 0; background-color: var(--fb-bg); color: var(--fb-text); padding-bottom: 70px; }
        
        /* Header & Nav */
        .header { background: var(--fb-card); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--fb-divider); }
        .header h1 { font-size: 24px; margin: 0; color: white; letter-spacing: -1px; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--fb-card); display: flex; border-top: 1px solid var(--fb-divider); z-index: 1000; }
        .nav-item { flex: 1; text-align: center; padding: 12px 0; font-size: 22px; cursor: pointer; color: var(--fb-secondary); }
        .nav-item.active { color: var(--fb-blue); border-bottom: 3px solid var(--fb-blue); }

        /* Feed Elements */
        .composer { background: var(--fb-card); padding: 12px; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .composer img { width: 40px; height: 40px; border-radius: 50%; }
        .composer-input { background: #3a3b3c; border-radius: 20px; padding: 10px 15px; flex: 1; color: var(--fb-secondary); cursor: pointer; }

        /* Stories */
        .stories { display: flex; gap: 8px; overflow-x: auto; padding: 10px; background: var(--fb-card); margin-bottom: 8px; }
        .story-card { min-width: 100px; height: 170px; border-radius: 10px; position: relative; background: #333; flex-shrink: 0; border: 1px solid var(--fb-divider); }
        .story-card img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }

        /* Posts */
        .post-card { background: var(--fb-card); margin-bottom: 8px; border-bottom: 1px solid var(--fb-divider); }
        .post-header { padding: 12px; display: flex; align-items: center; gap: 10px; }
        .post-header img { width: 40px; height: 40px; border-radius: 50%; }
        .post-image { width: 100%; height: auto; display: block; }
        .post-actions { display: flex; border-top: 1px solid var(--fb-divider); padding: 5px 0; }
        .action-btn { flex: 1; text-align: center; padding: 10px; font-weight: 600; color: var(--fb-secondary); font-size: 14px; cursor: pointer; }
        .action-btn.liked { color: var(--fb-blue); }

        /* People You May Know */
        .pymk-section { background: var(--fb-card); padding: 12px; margin-bottom: 8px; }
        .pymk-list { display: flex; overflow-x: auto; gap: 10px; padding: 10px 0; }
        .pymk-card { min-width: 150px; background: #3a3b3c; border-radius: 8px; overflow: hidden; }
        .pymk-card img { width: 150px; height: 150px; object-fit: cover; }
        .pymk-card b { display: block; padding: 5px 10px; font-size: 14px; }
        .add-btn { background: var(--fb-blue); color: white; border: none; width: 90%; margin: 5px 5%; padding: 8px; border-radius: 5px; font-weight: bold; }

        /* View Management */
        .view { display: none; }
        #auth-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--fb-bg); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        
        /* Menu Grid */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
        .menu-item { background: var(--fb-card); padding: 15px; border-radius: 8px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>

    <div id="auth-modal">
        <div style="width: 85%; text-align: center;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_%282019%29.png" width="60">
            <form id="login-form" style="margin-top: 40px;">
                <input type="email" id="login-email" placeholder="Mobile number or email" style="width: 100%; padding: 15px; background: #1c1e21; border: 1px solid #333; color: white; border-radius: 8px; margin-bottom: 10px;">
                <input type="password" id="login-password" placeholder="Password" style="width: 100%; padding: 15px; background: #1c1e21; border: 1px solid #333; color: white; border-radius: 8px; margin-bottom: 10px;">
                <button type="submit" style="width: 100%; padding: 12px; background: var(--fb-blue); color: white; border: none; border-radius: 20px; font-weight: bold; font-size: 16px;">Log In</button>
            </form>
            <p style="color: var(--fb-blue); margin-top: 20px;">Forgot password?</p>
            <button style="width: 100%; padding: 12px; background: transparent; color: var(--fb-blue); border: 1px solid var(--fb-blue); border-radius: 20px; margin-top: 50px;">Create new account</button>
        </div>
    </div>

    <div id="main-app" style="display:none;">
        <div class="header">
            <h1>facebook</h1>
            <div style="display: flex; gap: 15px;">
                <div onclick="openPostModal()">➕</div>
                <div>🔍</div>
                <div onclick="showView('chat')">💬</div>
            </div>
        </div>

        <div id="feed-view" class="view" style="display: block;">
            <div class="composer">
                <img id="user-avatar-small" src="images/default_profile.png">
                <div class="composer-input" onclick="openPostModal()">What's on your mind?</div>
            </div>

            <div class="stories" id="story-list">
                <div class="story-card">
                    <img src="images/cassava.JPG" style="opacity: 0.5;">
                    <div style="position: absolute; bottom: 10px; width: 100%; text-align: center; font-weight: bold; font-size: 12px;">Create story</div>
                </div>
            </div>

            <div id="feed-items"></div>
        </div>

        <div id="menu-view" class="view">
            <div style="padding: 15px; display: flex; align-items: center; gap: 10px;">
                <img id="menu-pic" src="images/default_profile.png" style="width: 45px; height: 45px; border-radius: 50%;">
                <b id="menu-name">Healing Root Agro Ventures</b>
            </div>
            <div class="menu-grid">
                <div class="menu-item">👥 Friends</div>
                <div class="menu-item" onclick="showView('products')">🏪 Marketplace</div>
                <div class="menu-item">🕒 Memories</div>
                <div class="menu-item">🔖 Saved</div>
                <div class="menu-item">📽️ Reels</div>
                <div class="menu-item" id="logout-btn" style="color: #f33;">🚪 Logout</div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="showView('feed')">🏠</div>
            <div class="nav-item" onclick="showView('reels')">🎞️</div>
            <div class="nav-item" onclick="showView('products')">🏪</div>
            <div class="nav-item" onclick="showView('notifications')">🔔</div>
            <div class="nav-item" onclick="showView('menu')">☰</div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
