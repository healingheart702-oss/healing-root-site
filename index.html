<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="cPJ3_emx8r6W7a_9249IO_Aj4NEH15CCtPqEgc18FN8" />
    <title>Healing Social</title>
    <style>
        :root {
            --hr-green: #2e7d32;
            --hr-bg: #121212;
            --hr-card: #1e1e1e;
            --hr-text: #ffffff;
            --hr-secondary: #a0a0a0;
            --hr-divider: #333;
            --fb-blue: #1877f2;
        }
        body { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; margin: 0; background: var(--hr-bg); color: var(--hr-text); padding-bottom: 70px; overflow-x: hidden; }
        
        /* Header & Navigation */
        .header { background: var(--hr-card); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--hr-divider); }
        .header h1 { color: var(--hr-green); font-size: 22px; margin: 0; font-weight: 800; letter-spacing: -1px; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--hr-card); display: flex; border-top: 1px solid var(--hr-divider); z-index: 1000; height: 60px; }
        .nav-item { flex: 1; text-align: center; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; color: var(--hr-secondary); transition: 0.2s; }
        .nav-item.active { color: var(--hr-green); border-top: 3px solid var(--hr-green); margin-top: -3px; }

        /* FB Style Profile Section */
        .profile-container { background: var(--hr-card); margin-bottom: 10px; }
        .cover-area { position: relative; height: 220px; background: #222; }
        .cover-photo { width: 100%; height: 100%; object-fit: cover; }
        .profile-avatar-area { position: relative; margin-top: -60px; padding-left: 20px; display: flex; align-items: flex-end; gap: 15px; }
        .profile-pic-overlap { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--hr-bg); background: #1a1a1a; object-fit: cover; }
        .cam-btn { position: absolute; background: #3a3b3c; border: none; color: white; padding: 8px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; border: 2px solid var(--hr-bg); }
        
        /* Feed & Posts */
        .composer { background: var(--hr-card); padding: 15px; margin-bottom: 10px; }
        .composer-top { display: flex; align-items: center; gap: 10px; }
        .composer-top img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .composer-input { background: #3a3b3c; border-radius: 20px; padding: 10px 15px; flex: 1; color: var(--hr-secondary); cursor: pointer; font-size: 15px; }
        .post-card { background: var(--hr-card); margin-bottom: 10px; border-bottom: 1px solid var(--hr-divider); }
        
        /* UI Elements */
        .btn-green { background: var(--hr-green); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; }
        .btn-gray { background: #3a3b3c; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; }
        .user-row { background: #242526; padding: 12px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        
        /* Modals */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--hr-bg); z-index: 2000; display: none; flex-direction: column; }
        textarea { width: 100%; background: transparent; color: white; border: none; padding: 15px; font-size: 18px; resize: none; outline: none; }
        
        /* Auth Screen */
        .auth-container { width: 100%; max-width: 400px; padding: 20px; text-align: center; }
        .auth-input { width: 100%; padding: 14px; background: #242526; border: 1px solid #333; color: white; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; font-size: 16px; }
    </style>
</head>
<body>

    <div id="auth-modal" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #000;">
        <div class="auth-container">
            <h1 style="color: var(--hr-green); font-size: 32px; margin-bottom: 5px;">Healing Social</h1>
            <p style="color: var(--hr-secondary); margin-bottom: 30px;">Grow together, connect forever.</p>
            
            <button onclick="loginWithGoogle()" class="btn-green" style="width:100%; background:white; color:black; display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:20px; border-radius:8px; padding:12px;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/button/google/web/1x/btn_google_light_normal_ios.svg" width="18">
                Continue with Google
            </button>

            <form id="auth-form">
                <input type="text" id="auth-name" placeholder="Full Name" class="auth-input" style="display: none;">
                <input type="email" id="auth-email" placeholder="Email Address" class="auth-input" required>
                <input type="password" id="auth-password" placeholder="Password" class="auth-input" required>
                <button type="submit" id="auth-submit-btn" class="btn-green" style="width: 100%; font-size:18px;">Log In</button>
            </form>
            <p id="auth-toggle" onclick="toggleAuthMode()" style="margin-top: 20px; color: var(--hr-green); cursor: pointer; font-weight: 600;">
                Create New Account
            </p>
        </div>
    </div>

    <div id="main-app" style="display: none;">
        <div class="header">
            <h1>HEALING</h1>
            <div style="display: flex; gap: 15px;">
                <div onclick="openPostModal()" style="cursor:pointer; background:#3a3b3c; width:35px; height:35px; display:flex; align-items:center; justify-content:center; border-radius:50%;">➕</div>
                <div onclick="showView('notifications')" style="cursor:pointer; background:#3a3b3c; width:35px; height:35px; display:flex; align-items:center; justify-content:center; border-radius:50%; position:relative;">
                    🔔<span id="notif-count" style="display:none; position:absolute; top:-5px; right:-5px; background:red; font-size:10px; padding:2px 5px; border-radius:50%;">0</span>
                </div>
            </div>
        </div>

        <div id="home-view" class="view" style="display: block;">
            <div class="composer">
                <div class="composer-top">
                    <img class="user-avatar-sync" src="images/default_profile.png">
                    <div class="composer-input" onclick="openPostModal()">What's on your mind?</div>
                </div>
            </div>
            <div id="feed-items"></div>
        </div>

        <div id="people-view" class="view">
            <div style="padding:15px; display:flex; justify-content:space-between; align-items:center;">
                <h2 style="margin:0;">People You May Know</h2>
            </div>
            <div id="people-list" style="padding: 0 15px;"></div>
        </div>

        <div id="notifications-view" class="view">
            <h2 style="padding:15px;">Notifications</h2>
            <div id="notifications-list"></div>
        </div>

        <div id="edit-profile-view" class="view">
            <div class="profile-container">
                <div class="cover-area">
                    <img id="cover-pic-preview" src="images/HEALING_ROOT_BANNER.jpg" class="cover-photo">
                    <button class="cam-btn" style="bottom:10px; right:10px;" onclick="$('#cover-upload').click()">📷</button>
                </div>
                <div class="profile-avatar-area">
                    <div style="position:relative;">
                        <img id="profile-pic-preview" src="images/default_profile.png" class="profile-pic-overlap">
                        <button class="cam-btn" style="bottom:5px; right:5px;" onclick="$('#pic-upload').click()">📷</button>
                    </div>
                    <div style="margin-bottom:10px;">
                        <h2 id="display-name-header" style="margin:0; font-size:24px;">Loading...</h2>
                        <p id="follower-count" style="margin:0; color:var(--hr-secondary); font-size:14px;">0 friends</p>
                    </div>
                </div>
                
                <div style="padding: 15px;">
                    <p id="display-bio" style="margin: 10px 0; color: #ccc;">No bio set yet...</p>
                    <div style="display: flex; gap: 10px; margin-top: 15px;">
                        <button class="btn-green" style="flex:1" onclick="editProfileName()">Edit Name</button>
                        <button class="btn-gray" style="flex:1" onclick="editBio()">Edit Bio</button>
                    </div>
                    <button class="btn-gray" style="width:100%; margin-top:10px; background:#4e4f50" onclick="logout()">Log Out</button>
                </div>
            </div>
            <input type="file" id="pic-upload" style="display:none;" accept="image/*" onchange="uploadNewProfilePic(this)">
            <input type="file" id="cover-upload" style="display:none;" accept="image/*" onchange="uploadCoverPic(this)">
        </div>

        <div id="post-modal" class="modal">
            <div style="padding: 15px; display: flex; justify-content: space-between; align-items:center; border-bottom: 1px solid var(--hr-divider);">
                <span onclick="closePostModal()" style="font-size:24px; cursor:pointer;">✕</span>
                <b style="font-size:18px;">Create Post</b>
                <button class="btn-green" onclick="submitPost()">Post</button>
            </div>
            <textarea id="post-text" placeholder="What's on your mind?"></textarea>
            <div style="padding: 15px; border-top:1px solid #333;">
                <p style="margin-bottom:10px; font-size:14px; color:var(--hr-secondary);">Add to your post</p>
                <input type="file" id="post-file-input" accept="image/*" style="color:white;">
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="showView('home')">🏠</div>
            <div class="nav-item" onclick="showView('people')">👥</div>
            <div class="nav-item" onclick="showView('notifications')">🔔</div>
            <div class="nav-item" onclick="showView('edit-profile')">👤</div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
    <script>
        const $ = s => document.querySelector(s);
        window.openPostModal = () => $('#post-modal').style.display = 'flex';
        window.closePostModal = () => $('#post-modal').style.display = 'none';
        window.showView = (v) => {
            document.querySelectorAll('.view').forEach(view => view.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
                // Simple logic to set active state based on icon click
                if(item.getAttribute('onclick').includes(v)) item.classList.add('active');
            });
            $(`#${v}-view`).style.display = 'block';
        };
    </script>
</body>
</html>
