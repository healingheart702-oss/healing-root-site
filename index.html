<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healing Root Agro Ventures</title>
    <style>
        :root {
            --hr-green: #2e7d32; /* Brand Green */
            --hr-bg: #121212;
            --hr-card: #1e1e1e;
            --hr-text: #ffffff;
            --hr-secondary: #a0a0a0;
            --hr-divider: #333;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--hr-bg); color: var(--hr-text); padding-bottom: 70px; overflow-x: hidden; }
        
        /* Branded Header */
        .header { background: var(--hr-card); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--hr-divider); }
        .header h1 { color: var(--hr-green); font-size: 20px; margin: 0; text-transform: uppercase; letter-spacing: 1px; }

        /* Navigation */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--hr-card); display: flex; border-top: 1px solid var(--hr-divider); z-index: 1000; }
        .nav-item { flex: 1; text-align: center; padding: 15px 0; font-size: 20px; cursor: pointer; color: var(--hr-secondary); transition: 0.3s; }
        .nav-item.active { color: var(--hr-green); border-top: 3px solid var(--hr-green); }

        /* Real-time Post Cards */
        .post-card { background: var(--hr-card); margin-bottom: 8px; padding-bottom: 10px; position: relative; }
        .post-header { padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        .post-info { display: flex; gap: 10px; align-items: center; }
        .post-info img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .post-image, .post-video { width: 100%; max-height: 500px; display: block; object-fit: cover; }
        
        /* Comments & Replies */
        .comment-section { padding: 10px 15px; background: #252525; border-top: 1px solid var(--hr-divider); }
        .comment-bubble { background: #333; padding: 8px 12px; border-radius: 15px; margin-bottom: 5px; font-size: 14px; }
        .reply-bubble { margin-left: 30px; background: #444; border-left: 2px solid var(--hr-green); }
        
        /* Menu & Profile */
        .view { display: none; padding: 10px; }
        .menu-btn { background: #333; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        
        /* Edit/Delete Dropdown */
        .post-menu { position: absolute; right: 10px; top: 10px; cursor: pointer; }
        .dropdown { position: absolute; right: 0; background: #333; border-radius: 5px; display: none; flex-direction: column; z-index: 10; }
        .dropdown button { background: none; border: none; color: white; padding: 10px 20px; text-align: left; cursor: pointer; }
        .dropdown button:hover { background: var(--hr-green); }
    </style>
</head>
<body>

    <div id="main-app">
        <div class="header">
            <h1>HEALING ROOT</h1>
            <div style="display: flex; gap: 15px;">
                <div onclick="openPostModal()">➕</div>
                <div id="notif-icon">🔔<span id="notif-count" style="display:none; background:red; border-radius:50%; font-size:10px; padding:2px 5px;">0</span></div>
                <div onclick="showView('chat')">💬</div>
            </div>
        </div>

        <div id="home-view" class="view" style="display: block;">
            <div id="feed-items"></div>
        </div>

        <div id="reels-view" class="view">
            <div id="reels-container"></div>
        </div>

        <div id="marketplace-view" class="view">
            <h2 style="color: var(--hr-green);">Agro Marketplace</h2>
            <div id="market-list" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"></div>
        </div>

        <div id="notifications-view" class="view">
            <h3>Recent Updates</h3>
            <div id="notif-list"></div>
        </div>

        <div id="menu-view" class="view">
            <div class="menu-btn" onclick="showView('edit-profile')">
                <img id="my-profile-pic" src="images/default_profile.png" style="width:50px; border-radius:50%;">
                <div>
                    <b id="my-profile-name">Farmer Name</b><br>
                    <small>Edit your Profile</small>
                </div>
            </div>
            <div class="menu-btn" onclick="showView('marketplace')">🛒 My Marketplace</div>
            <div class="menu-btn" onclick="logout()">🚪 Logout</div>
        </div>

        <div id="edit-profile-view" class="view">
            <h3>Update Profile</h3>
            <input type="text" id="edit-name" placeholder="Full Name" style="width:100%; padding:10px; margin-bottom:10px;">
            <input type="file" id="edit-pic" style="margin-bottom:10px;">
            <button onclick="updateProfile()" style="background:var(--hr-green); color:white; border:none; padding:10px; width:100%;">Save Changes</button>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="showView('home')">🏠</div>
            <div class="nav-item" onclick="showView('reels')">🎞️</div>
            <div class="nav-item" onclick="showView('marketplace')">🏪</div>
            <div class="nav-item" onclick="showView('notifications')">🔔</div>
            <div class="nav-item" onclick="showView('menu')">☰</div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
